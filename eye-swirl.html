<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Eye swirl — black eye, single spiral</title>
<link rel="canonical" href="https://www.allthings.design/eye-swirl" />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="stylesheet" href="https://use.typekit.net/qfa8ptg.css" />
<script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
<style>
  :root {
    --bg: #fbfbfb;
    --fg: #111;
    --meta: #5c5c5c;
    --mono: "ff-attribute-mono", "JetBrains Mono", ui-monospace, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--mono);
    min-height: 100vh;
    display: grid;
    place-items: center;
    gap: 32px;
    padding: 40px;
  }

  .stage {
    width: 100px;
    height: 100px;
    display: grid;
    place-items: center;
    position: relative;
    cursor: pointer;
  }

  /* ---- BURST: radial spikes that pop on click ---- */
  .burst {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: visible;          /* spikes can extend past the box */
    pointer-events: none;
    z-index: 2;
  }
  /* Each spike = a <line> with a moving dash. The dash travels outward
     along the line (inner end vanishes as outer end keeps going), creating
     the "spark / sparkle" feel rather than a solid bar. */
  .spike-line {
    fill: none;
    stroke: #000;
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-dasharray: 35 65;        /* 35% visible dash, 65% gap (pathLength = 100) */
    stroke-dashoffset: 100;         /* start: dash off the line, invisible */
    opacity: 0;
    vector-effect: non-scaling-stroke;
  }

  .stage.bursting .spike-line {
    animation: spark var(--dur, 520ms) cubic-bezier(.42, 0, .25, 1) forwards;
    animation-delay: var(--delay, 0s);
  }

  /* sparkle: dash slides from inner end → past outer end; opacity fades in then out */
  @keyframes spark {
    0%   { stroke-dashoffset: 100; opacity: 0; }
    18%  {                          opacity: 1; }
    78%  {                          opacity: 1; }
    100% { stroke-dashoffset: -35; opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .stage.bursting .spike-line { animation: none; }
  }

  svg.eye {
    width: 100%;
    height: 100%;
    display: block;
    transform-origin: center;
    will-change: clip-path;
    clip-path: inset(0% 0% 0% 0%);
  }

  /* Blink on hover — eyelids close from top + bottom, meet at center, open.
     clip-path inset acts like a vertical mask: lids sweep in (close), hold,
     sweep out (open). Asymmetric easing makes it feel anatomical:
       close = ease-in (lid accelerates and snaps shut)
       open  = ease-out (lid releases fast then settles)
     Two stacked animations handle the asymmetry. */
  .stage:hover .eye {
    animation:
      blinkClose 0.16s cubic-bezier(.55, 0, .85, 0.4) forwards,
      blinkHold  0.06s linear 0.16s forwards,
      blinkOpen  0.28s cubic-bezier(.2, .9, .4, 1)   0.22s forwards;
  }
  @keyframes blinkClose {
    from { clip-path: inset(0% 0% 0% 0%); }
    to   { clip-path: inset(50% 0% 50% 0%); }
  }
  @keyframes blinkHold {
    from, to { clip-path: inset(50% 0% 50% 0%); }
  }
  @keyframes blinkOpen {
    from { clip-path: inset(50% 0% 50% 0%); }
    to   { clip-path: inset(0% 0% 0% 0%); }
  }

  @media (prefers-reduced-motion: reduce) {
    .stage:hover .eye { animation: none; }
  }

  /* Solid black eye fill */
  .eye-fill { fill: var(--fg); }

  /* The single spiral that rotates inside.
     CCW rotation on a CCW-wound spiral makes the arms appear to flow
     INWARD toward the center — "going inside" illusion.
     translateZ + will-change forces a GPU compositor layer for jitter-free spin. */
  .spiral {
    fill: var(--bg);                /* light spiral on black eye */
    transform-box: fill-box;
    transform-origin: center;
    will-change: transform;
    backface-visibility: hidden;
    animation: spin 12s linear infinite;
  }
  @keyframes spin {
    from { transform: translateZ(0) rotate(0deg); }
    to   { transform: translateZ(0) rotate(-360deg); }
  }


  .cap {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--meta);
  }

  @media (prefers-reduced-motion: reduce) {
    .spiral { animation: none; }
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <svg class="eye" viewBox="0 0 97.63 66.84" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"
    <defs>
      <!-- Pupil clip — the swirl is constrained to this circle, not the whole eye -->
      <clipPath id="pupilClip" clipPathUnits="userSpaceOnUse">
        <circle cx="48.815" cy="33.42" r="22" />
      </clipPath>
    </defs>

    <!-- Solid black eye (cog shape) -->
    <path class="eye-fill" d="M48.82,63.63c2.79,0,5.86,3.55,8.52,3.18s4.42-4.61,7-5.35,6.79,1.78,9.22.68,2.56-5.59,4.77-7.02c2.22-1.43,7.07-.17,9-1.89,1.93-1.72.48-6.01,2.1-7.98s6.66-2.08,7.9-4.25c1.23-2.15-1.74-5.25-.9-7.58-.85-2.33,2.13-5.43.9-7.58-1.25-2.17-6.3-2.29-7.9-4.25s-.16-6.26-2.1-7.98-6.78-.45-9-1.89-2.32-5.91-4.77-7.02-6.59,1.43-9.22.68S60.08.41,57.34.03s-5.74,3.18-8.52,3.18S42.96-.35,40.29.03s-4.42,4.61-7,5.35-6.79-1.78-9.22-.68-2.56,5.59-4.77,7.02-7.07.17-9,1.89-.48,6.01-2.1,7.98S1.55,23.66.3,25.84s1.74,5.25.9,7.58c.85,2.33-2.13,5.43-.9,7.58s6.3,2.29,7.9,4.25.16,6.26,2.1,7.98c1.93,1.72,6.78.45,9,1.89,2.21,1.43,2.32,5.91,4.77,7.02,2.43,1.1,6.59-1.43,9.22-.68,2.58.74,4.26,4.97,7,5.35s5.74-3.18,8.52-3.18Z" />

    <!-- Spiral inside the pupil circle. Gaps reveal the black eye behind. -->
    <g clip-path="url(#pupilClip)">
      <path id="spiral" class="spiral" />
    </g>
  </svg>

  <!-- Click burst overlay: 16 radial spikes generated by JS. Sits on top of the eye. -->
  <svg class="burst" id="burst" viewBox="-50 -50 100 100" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg>
</div>

<p class="cap">black eye · single spiral · illusion</p>

<script>
  // Archimedean barber-pole spiral as a filled ribbon.
  // No visible beginning OR end:
  //   • starts at radius 0 — inner "tip" collapses to a point at center
  //   • extends past the eye bounds — outer end is hidden by the clip-path
  //
  // step      = distance between adjacent coil centers (arm + gap)
  // armWidth  = thickness of the white arm
  // gap       = step - armWidth  (visible black space between arms)
  function spiralRibbon(cx, cy, step, armWidth, turns, samplesPerTurn = 240) {
    const samples = turns * samplesPerTurn;
    const tMax = turns * Math.PI * 2;
    const k = step / (Math.PI * 2);   // r-per-radian

    const outer = [];
    const inner = [];
    for (let i = 0; i <= samples; i++) {
      const t = (i / samples) * tMax;
      const r = k * t;                // start = 0
      const cos = Math.cos(t), sin = Math.sin(t);
      const ro = r;
      const ri = Math.max(0, r - armWidth);
      outer.push([cx + ro * cos, cy + ro * sin]);
      inner.push([cx + ri * cos, cy + ri * sin]);
    }

    if (outer.length < 2) return '';

    let d = 'M' + outer[0][0].toFixed(3) + ',' + outer[0][1].toFixed(3);
    for (let i = 1; i < outer.length; i++) {
      d += 'L' + outer[i][0].toFixed(3) + ',' + outer[i][1].toFixed(3);
    }
    for (let i = inner.length - 1; i >= 0; i--) {
      d += 'L' + inner[i][0].toFixed(3) + ',' + inner[i][1].toFixed(3);
    }
    d += 'Z';
    return d;
  }

  // Pupil radius = 22. Wider gap.
  // step=5.4, armWidth=2.7 → arm 2.7, gap 2.7 (equal, max contrast).
  // turns=5 reaches r=27 (clipped at pupil r=22).
  const path = spiralRibbon(48.815, 33.42, 5.4, 2.7, 5);
  document.getElementById('spiral').setAttribute('d', path);

  // ---- BURST: build the radial spike lines ----
  (function () {
    const burst = document.getElementById('burst');
    const SVG_NS = 'http://www.w3.org/2000/svg';
    const N = 18;                    // number of spikes (more = denser sparkle)
    const minLen = 32, maxLen = 78;  // some short, some long → varied sparkles
    const innerOffset = 22;          // start outside the pupil

    for (let i = 0; i < N; i++) {
      // Distribute angles roughly evenly but with some jitter for organic feel
      const baseAngle = (i / N) * 360;
      const jitter = (Math.random() - 0.5) * (360 / N) * 0.4;
      const angle = baseAngle + jitter;

      const len = minLen + Math.random() * (maxLen - minLen);
      const delay = Math.random() * 90;             // 0-90ms stagger
      const duration = 380 + Math.random() * 360;   // 380-740ms (random life)

      const g = document.createElementNS(SVG_NS, 'g');
      g.setAttribute('transform', `rotate(${angle.toFixed(2)})`);

      const line = document.createElementNS(SVG_NS, 'line');
      line.setAttribute('x1', '0');
      line.setAttribute('y1', String(innerOffset));
      line.setAttribute('x2', '0');
      line.setAttribute('y2', String(innerOffset + len));
      line.setAttribute('pathLength', '100');     // normalize dash math regardless of length
      line.classList.add('spike-line');
      line.style.setProperty('--delay', delay.toFixed(0) + 'ms');
      line.style.setProperty('--dur', duration.toFixed(0) + 'ms');

      g.appendChild(line);
      burst.appendChild(g);
    }
  })();

  // ---- Click handler: trigger burst ----
  (function () {
    const stage = document.getElementById('stage');
    let resetTimer = null;
    const MAX_LIFE = 90 + 740;       // max delay + max duration

    stage.addEventListener('click', () => {
      stage.classList.remove('bursting');
      void stage.offsetWidth;        // force reflow → restart cleanly
      stage.classList.add('bursting');

      clearTimeout(resetTimer);
      resetTimer = setTimeout(() => {
        stage.classList.remove('bursting');
      }, MAX_LIFE + 50);
    });
  })();
</script>

<script defer src="/_vercel/insights/script.js"></script>
<script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
