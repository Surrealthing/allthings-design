  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #000;
      width: 100%; height: 100%;
      overflow: hidden;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
      position: fixed;
      inset: 0;
    }
    .mono {
      font-family: 'Syne Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    }
    canvas {
      display: block;
      touch-action: none;
      will-change: transform;
      transform-style: preserve-3d;
      transition: none;
    }
    #info {
      position: fixed; bottom: 28px; left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.4);
      font-family: 'Syne Mono', ui-monospace, monospace;
      font-size: 12px; letter-spacing: 1.5px;
      pointer-events: none; transition: opacity 2s;
      text-align: center; width: 80%;
      opacity: 0;
      text-shadow:
        0 0 3px rgba(0,0,0,0.35),
        0 0 6px rgba(0,0,0,0.2);
    }

    /* ============ ENTRY SCREEN ============ */
    #startOverlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(ellipse at center, rgba(20,10,40,0.55) 0%, rgba(4,2,12,0.78) 60%, rgba(0,0,0,0.88) 100%);
      display: flex; justify-content: center; align-items: center;
      z-index: 100; transition: opacity 2.6s ease;
    }
    #startOverlay .inner {
      text-align: center;
      padding: 24px;
    }
    #startOverlay .mark {
      font-family: 'Syne Mono', ui-monospace, monospace;
      font-size: 11px;
      letter-spacing: 6px;
      color: rgba(220, 200, 255, 0.45);
      text-transform: uppercase;
      margin-bottom: 28px;
      opacity: 0;
      animation: fadeIn 1s ease 0.15s forwards;
    }
    #startOverlay .title {
      font-family: 'Syne Mono', ui-monospace, monospace;
      font-weight: 400;
      font-size: 64px;
      letter-spacing: 14px;
      margin-bottom: 22px;
      color: rgba(232, 216, 255, 0.95);
      text-transform: lowercase;
      line-height: 1;
      text-indent: 14px;
      display: flex;
      justify-content: center;
      gap: 0;
    }
    #startOverlay .title .lt {
      display: inline-block;
      opacity: 0;
      transform: translateY(28px) scale(0.92);
      filter: blur(8px);
      animation: letterIn 1.2s cubic-bezier(0.2, 0.9, 0.2, 1) forwards;
      will-change: transform, opacity, filter;
    }
    @keyframes letterIn {
      0%   { opacity: 0; transform: translateY(28px) scale(0.92); filter: blur(8px); }
      60%  { opacity: 0.85; filter: blur(2px); }
      100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    #startOverlay .tagline {
      font-family: 'Syne Mono', ui-monospace, monospace;
      font-size: 12px;
      letter-spacing: 4px;
      color: rgba(255,255,255,0.42);
      text-transform: lowercase;
      margin-bottom: 56px;
      opacity: 0;
      animation: fadeIn 1.4s ease 1.6s forwards;
    }
    #startOverlay .cta {
      font-family: 'Syne Mono', ui-monospace, monospace;
      background: transparent;
      border: 1px solid rgba(220, 200, 255, 0.35);
      border-radius: 999px;
      color: rgba(232, 216, 255, 0.9);
      font-size: 13px;
      letter-spacing: 3.5px;
      padding: 16px 36px;
      cursor: pointer;
      text-transform: lowercase;
      transition: background 0.5s ease, border-color 0.5s ease, letter-spacing 0.5s ease, color 0.5s ease, box-shadow 0.5s ease, transform 0.3s ease;
      -webkit-tap-highlight-color: transparent;
      outline: none;
      opacity: 0;
      animation: fadeIn 1.4s ease 1.9s forwards;
    }
    #startOverlay .cta:hover,
    #startOverlay .cta:focus-visible {
      background: rgba(220, 200, 255, 0.06);
      border-color: rgba(220, 200, 255, 0.65);
      letter-spacing: 4.5px;
      color: rgba(245, 235, 255, 1);
      box-shadow: 0 0 32px rgba(180, 160, 255, 0.18);
    }
    #startOverlay .cta:active {
      transform: scale(0.98);
    }
    #startOverlay .hint {
      margin-top: 32px;
      font-family: 'Syne Mono', ui-monospace, monospace;
      font-size: 10px;
      letter-spacing: 2.5px;
      color: rgba(255,255,255,0.28);
      text-transform: lowercase;
      opacity: 0;
      animation: fadeIn 1.4s ease 2.3s forwards;
    }

    #typeName {
      position: fixed; top: 22px; left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0);
      font-family: 'Syne Mono', ui-monospace, monospace;
      font-size: 14px; letter-spacing: 4px; font-weight: 400;
      pointer-events: none;
      transition: color 1.5s, opacity 1.5s;
      text-transform: lowercase;
      white-space: nowrap;
      text-shadow:
        0 0 3px rgba(0,0,0,0.4),
        0 0 8px rgba(0,0,0,0.25);
    }
    #changeHint {
      position: fixed; left: 50%; top: 75%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0);
      font-family: 'Syne Mono', ui-monospace, monospace;
      font-size: 11px; letter-spacing: 4px; font-weight: 400;
      pointer-events: none;
      transition: color 1.6s ease, opacity 1.6s ease, letter-spacing 4s ease, top 0.4s ease;
      text-transform: lowercase;
      white-space: nowrap;
      text-align: center;
      text-shadow:
        0 0 3px rgba(0,0,0,0.4),
        0 0 8px rgba(0,0,0,0.25);
    }
    #changeHint.visible {
      color: rgba(255,255,255,0.36);
      letter-spacing: 5px;
      animation: hintBreathe 5.5s ease-in-out infinite;
    }
    @keyframes hintBreathe {
      0%, 100% { opacity: 0.7; }
      50%      { opacity: 1.0; }
    }
    @media (min-width: 768px) {
      #changeHint { font-size: 12px; }
    }
    /* Soft dark radial backdrop behind the universe message — improves readability
       against the busy geometry without making it look like a card. Sits between
       the canvas geometry and the message text. */
    #messageBackdrop {
      position: fixed;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      width: 560px; height: 360px;
      pointer-events: none;
      z-index: 9;
      background: radial-gradient(ellipse at center,
        rgba(0,0,0,0.78) 0%,
        rgba(0,0,0,0.55) 35%,
        rgba(0,0,0,0.25) 65%,
        rgba(0,0,0,0) 100%);
      opacity: 0;
      transition: opacity 2s ease;
    }
    #messageBackdrop.visible { opacity: 1; }
    @media (max-width: 480px) {
      #messageBackdrop { width: 90vw; height: 320px; }
    }
    #universeMessage {
      position: fixed;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%) perspective(800px) rotateX(0deg) rotateY(0deg);
      color: rgba(255, 255, 255, 0);
      font-family: 'Syne Mono', ui-monospace, monospace;
      font-size: 15px;
      letter-spacing: 2px;
      font-weight: 400;
      line-height: 2.0;
      text-align: center;
      pointer-events: auto;
      z-index: 10;
      white-space: pre-line;
      max-width: 360px;
      transition: color 2s ease, text-shadow 0.4s ease;
      text-shadow:
        0 0 3px rgba(0,0,0,0.45),
        0 0 8px rgba(0,0,0,0.3);
      cursor: default;
      -webkit-user-select: none;
      user-select: none;
      will-change: transform, text-shadow;
      transform-style: preserve-3d;
    }
    #universeMessage .ch {
      display: inline-block;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
      transform: scale(1) translateZ(0px);
      will-change: transform;
    }
    #universeMessage.visible {
      color: rgba(255, 255, 255, 0.6);
    }
    #universeMessage.glow {
      color: rgba(255, 255, 255, 0.95);
      text-shadow:
        0 0 3px rgba(0,0,0,0.4),
        0 0 8px rgba(0,0,0,0.25),
        0 0 22px rgba(200, 180, 255, 0.4),
        0 0 44px rgba(180, 160, 255, 0.2),
        0 0 80px rgba(160, 140, 255, 0.1);
    }

    @media (min-width: 768px) {
      canvas { cursor: none; }
      #startOverlay .title { font-size: 84px; letter-spacing: 18px; text-indent: 18px; }
      #startOverlay .tagline { font-size: 13px; }
      #startOverlay .cta { font-size: 14px; padding: 18px 40px; }
      #typeName { font-size: 16px; top: 26px; }
      #info { font-size: 13px; }
      #universeMessage { font-size: 17px; max-width: 440px; letter-spacing: 2.5px; line-height: 2.1; }
    }
    @media (max-width: 380px) {
      #startOverlay .title { font-size: 52px; letter-spacing: 10px; text-indent: 10px; }
    }
  </style>
</head>
<body>
  <div id="startOverlay">
    <div class="inner">
      <div class="mark">✦</div>
      <h1 class="title" id="witnessTitle"></h1>
      <p class="tagline">what watches when you watch</p>
      <button type="button" class="cta" id="beginBtn">begin the journey</button>
      <p class="hint" id="startHint"></p>
    </div>
  </div>
  <div id="typeName"></div>
  <div id="messageBackdrop"></div>
  <div id="universeMessage"></div>
  <div id="changeHint"></div>
  <div id="info"></div>

  <script>
    // ============ CAPTURE MODE (for headless screenshotting) ============
    var _params = new URLSearchParams(window.location.search);
    var CAPTURE_MODE = _params.get('capture') === '1';
    var CAPTURE_GEO = Math.max(0, Math.min(23, parseInt(_params.get('geo') || '0', 10) || 0));
    var CAPTURE_HOVER = _params.get('hover') === '1';
    var CAPTURE_NO_UI = _params.get('cleanui') === '1';

    const isMobile = ('ontouchstart' in window && navigator.maxTouchPoints > 0)

    function genFlowerOfLife(cx, cy, r, lyrs) {
      let cs = [{ x: cx, y: cy, layer: 0 }];
      for (let l = 1; l <= lyrs; l++) {
        for (let ring = 1; ring <= l; ring++) {
          let rr = r * ring, count = 6 * ring;
          for (let i = 0; i < count; i++) {
            let a = (TWO_PI/count)*i - PI/6;
            let x = cx+rr*cos(a), y = cy+rr*sin(a);
            if (dist(x,y,cx,cy) <= r*lyrs+1) {
              let dup = false;
              for (let c of cs) if (dist(c.x,c.y,x,y) < r*0.1) { dup=true; break; }
              if (!dup) cs.push({ x, y, layer: ring });
            }
          }
        }
      }
      let temp = [];
      for (let l = 1; l <= lyrs; l++) {
        let rr = r*l, total = 6*l;
        for (let i = 0; i < total; i++) {
          let a = (TWO_PI/total)*i;
          let x = cx+rr*cos(a), y = cy+rr*sin(a);
          if (dist(x,y,cx,cy) <= r*(lyrs+0.5)) {
            let dup = false;
            for (let c of cs) if (dist(c.x,c.y,x,y) < r*0.1) { dup=true; break; }
            for (let c of temp) if (dist(c.x,c.y,x,y) < r*0.1) { dup=true; break; }
            if (!dup) temp.push({ x, y, layer: l });
          }
        }
      }
      return cs.concat(temp);
    }

    function genMerkaba(cx, cy, r) {

      for (let s = 0; s < scales.length; s++) {

        for (let i = 0; i < 3; i++) {

        for (let i = 0; i < 3; i++) {
          let a1 = TWO_PI/3*i - PI/2, a2 = TWO_PI/3*((i+1)%3) - PI/2;
          cs.push({ x:(cx+sz*cos(a1)+cx+sz*cos(a2))/2, y:(cy+sz*sin(a1)+cy+sz*sin(a2))/2, layer:s+1 });
          a1 = TWO_PI/3*i + PI/2; a2 = TWO_PI/3*((i+1)%3) + PI/2;
          cs.push({ x:(cx+sz*cos(a1)+cx+sz*cos(a2))/2, y:(cy+sz*sin(a1)+cy+sz*sin(a2))/2, layer:s+1 });

        for (let c=0;c<4;c++) {
          let a = PI/2*c + PI/4 + rot;
          cs.push({ x:cx+sz*cos(a), y:cy+sz*sin(a), layer:s+1 });
        }
      }
      return cs;
    }

    function gen64Tetrahedron(cx, cy, r) {
      let cs = [{ x:cx, y:cy, layer:0 }];
      for (let layer=1; layer<=4; layer++) {
        let count = layer * 6;
        for (let i=0;i<count;i++) {
          let a = TWO_PI/count*i - PI/6;
          let rr = r * layer * 0.75;
          cs.push({ x:cx+rr*cos(a), y:cy+rr*sin(a), layer:layer });
        }
        for (let i=0;i<count;i++) {
          let a = TWO_PI/count*i - PI/6 + PI/count;
          let rr = r * (layer-0.4) * 0.75;
          cs.push({ x:cx+rr*cos(a), y:cy+rr*sin(a), layer:layer });
        }
      }
      for (let i=0;i<18;i++) {
        let a = TWO_PI/18*i;
        cs.push({ x:cx+r*3.5*cos(a), y:cy+r*3.5*sin(a), layer:5 });
      }
      return cs;
    }

    function genTreeOfLife(cx, cy, r) {
      let cs = [];
      let seph = [
        { x:0, y:-3.0, l:0 },
        { x:-1.0, y:-2.0, l:1 },
        { x:1.0, y:-2.0, l:1 },
        { x:-1.0, y:-0.7, l:2 },
        { x:1.0, y:-0.7, l:2 },
        { x:0, y:-0.0, l:2 },
        { x:-1.0, y:0.7, l:3 },
        { x:1.0, y:0.7, l:3 },
        { x:0, y:1.5, l:3 },
        { x:0, y:2.7, l:4 },
      ];
      for (let s of seph) {
        cs.push({ x:cx+s.x*r, y:cy+s.y*r, layer:s.l });
      }
      for (let i=0; i<seph.length; i++) {
        for (let j=i+1; j<seph.length; j++) {
          let dx = seph[j].x - seph[i].x, dy = seph[j].y - seph[i].y;
          let d = Math.sqrt(dx*dx+dy*dy);
          if (d < 2.5) {
            cs.push({ x:cx+(seph[i].x+seph[j].x)*0.5*r, y:cy+(seph[i].y+seph[j].y)*0.5*r, layer:Math.max(seph[i].l,seph[j].l) });
            cs.push({ x:cx+(seph[i].x*0.75+seph[j].x*0.25)*r, y:cy+(seph[i].y*0.75+seph[j].y*0.25)*r, layer:seph[i].l });
            cs.push({ x:cx+(seph[i].x*0.25+seph[j].x*0.75)*r, y:cy+(seph[i].y*0.25+seph[j].y*0.75)*r, layer:seph[j].l });
          }
        }
      }
      for (let i=0;i<8;i++) {
        let yy = cy + map(i,0,7,-3.2,2.9)*r;
        cs.push({ x:cx-1.3*r, y:yy, layer:3 });
        cs.push({ x:cx+1.3*r, y:yy, layer:3 });
      }
      for (let i=0;i<12;i++) {
        let a = TWO_PI/12*i;
        cs.push({ x:cx+r*3.5*cos(a), y:cy+r*3.5*sin(a), layer:5 });
      }
      return cs;
    }

    function genGordianKnot(cx, cy, r) {
      let cs = [{ x:cx, y:cy, layer:0 }];
      let steps = 48;
      for (let i=0; i<steps; i++) {
        let t = TWO_PI * i / steps;
        let px = r * 1.8 * (sin(t) + 2*sin(2*t));
        let py = r * 1.8 * (cos(t) - 2*cos(2*t));
        let layer = Math.floor(i / (steps/4)) + 1;
        cs.push({ x:cx+px*0.35, y:cy+py*0.35, layer:Math.min(layer,4) });
      }
      for (let i=0; i<steps; i++) {
        let t = TWO_PI * i / steps + PI/6;
        let px = r * 1.0 * (sin(t) + 2*sin(2*t));
        let py = r * 1.0 * (cos(t) - 2*cos(2*t));
        cs.push({ x:cx+px*0.35, y:cy+py*0.35, layer:2 });
      }
      for (let i=0;i<6;i++) {
        let a = TWO_PI/6*i;
        cs.push({ x:cx+r*0.5*cos(a), y:cy+r*0.5*sin(a), layer:1 });
      }
      for (let i=0;i<12;i++) {
        let a = TWO_PI/12*i;
        cs.push({ x:cx+r*3.2*cos(a), y:cy+r*3.2*sin(a), layer:5 });
      }
      return cs;
    }

    // --- 13. Egg of Life: 8 spheres, second iteration of Genesis pattern ---
    function genEggOfLife(cx, cy, r) {
      let cs = [{ x:cx, y:cy, layer:0 }];
      for (let i=0;i<6;i++) {
        let a = TWO_PI/6*i - PI/6;
        cs.push({ x:cx+r*cos(a), y:cy+r*sin(a), layer:1 });
      }
      cs.push({ x:cx, y:cy-r*1.4, layer:2 });
      cs.push({ x:cx, y:cy+r*1.4, layer:2 });
      for (let i=0;i<8;i++) {
        let a = TWO_PI/8*i;
        cs.push({ x:cx+r*2.4*cos(a), y:cy+r*2.4*sin(a), layer:3 });
      }
      for (let i=0;i<14;i++) {
        let a = TWO_PI/14*i + PI/14;
        cs.push({ x:cx+r*3.4*cos(a), y:cy+r*3.4*sin(a), layer:4 });
      }
      return cs;
    }

    // --- 14. Fruit of Life: 13 circles (basis of Metatron's Cube) ---
    function genFruitOfLife(cx, cy, r) {
      let cs = [{ x:cx, y:cy, layer:0 }];
      for (let i=0;i<6;i++) {
        let a = TWO_PI/6*i - PI/6;
        cs.push({ x:cx+r*cos(a), y:cy+r*sin(a), layer:1 });
      }
      for (let i=0;i<6;i++) {
        let a = TWO_PI/6*i;
        cs.push({ x:cx+r*1.732*cos(a), y:cy+r*1.732*sin(a), layer:2 });
      }
      for (let i=0;i<12;i++) {
        let a = TWO_PI/12*i + PI/12;
        cs.push({ x:cx+r*2.7*cos(a), y:cy+r*2.7*sin(a), layer:3 });
      }
      for (let i=0;i<18;i++) {
        let a = TWO_PI/18*i;
        cs.push({ x:cx+r*3.6*cos(a), y:cy+r*3.6*sin(a), layer:4 });
      }
      return cs;
    }

    // --- 15. Vector Equilibrium (cuboctahedron): 12 vertices, perfectly balanced ---
    function genVectorEquilibrium(cx, cy, r) {
      let cs = [{ x:cx, y:cy, layer:0 }];
      for (let i=0;i<6;i++) {
        let a = TWO_PI/6*i;
        cs.push({ x:cx+r*1.0*cos(a), y:cy+r*1.0*sin(a), layer:1 });
      }
      for (let i=0;i<6;i++) {
        let a = TWO_PI/6*i + PI/6;
        cs.push({ x:cx+r*0.55*cos(a), y:cy+r*0.55*sin(a), layer:1 });
      }
      for (let i=0;i<6;i++) {
        let a = TWO_PI/6*i + PI/6;
        cs.push({ x:cx+r*1.7*cos(a), y:cy+r*1.7*sin(a), layer:2 });
      }
      for (let i=0;i<12;i++) {
        let a = TWO_PI/12*i;
        cs.push({ x:cx+r*2.6*cos(a), y:cy+r*2.6*sin(a), layer:3 });
      }
      for (let i=0;i<18;i++) {
        let a = TWO_PI/18*i + PI/18;
        cs.push({ x:cx+r*3.5*cos(a), y:cy+r*3.5*sin(a), layer:4 });
      }
      return cs;
    }

    // --- 16. Dodecahedron: 12-faced solid, nested pentagons ---
    function genDodecahedron(cx, cy, r) {
      let cs = [{ x:cx, y:cy, layer:0 }];
      for (let i=0;i<5;i++) {
        let a = TWO_PI/5*i - PI/2;
        cs.push({ x:cx+r*0.5*cos(a), y:cy+r*0.5*sin(a), layer:1 });
      }
      for (let i=0;i<5;i++) {
        let a = TWO_PI/5*i - PI/2 + PI/5;
        cs.push({ x:cx+r*1.0*cos(a), y:cy+r*1.0*sin(a), layer:2 });
      }
      for (let i=0;i<5;i++) {
        let a = TWO_PI/5*i - PI/2;
        cs.push({ x:cx+r*1.7*cos(a), y:cy+r*1.7*sin(a), layer:2 });
      }
      for (let i=0;i<5;i++) {
        let a = TWO_PI/5*i - PI/2 + PI/5;
        cs.push({ x:cx+r*2.5*cos(a), y:cy+r*2.5*sin(a), layer:3 });
      }
      for (let i=0;i<15;i++) {
        let a = TWO_PI/15*i;
        cs.push({ x:cx+r*3.4*cos(a), y:cy+r*3.4*sin(a), layer:4 });
      }
      return cs;
    }

    // --- 17. Octahedron: 8-faced, square + diagonals + outer ---
    function genOctahedron(cx, cy, r) {
      let cs = [{ x:cx, y:cy, layer:0 }];
      for (let i=0;i<4;i++) {
        let a = TWO_PI/4*i;
        cs.push({ x:cx+r*cos(a), y:cy+r*sin(a), layer:1 });
      }
      for (let i=0;i<4;i++) {
        let a = TWO_PI/4*i + PI/4;
        cs.push({ x:cx+r*0.7*cos(a), y:cy+r*0.7*sin(a), layer:1 });
      }
      for (let i=0;i<8;i++) {
        let a = TWO_PI/8*i;
        cs.push({ x:cx+r*1.7*cos(a), y:cy+r*1.7*sin(a), layer:2 });
      }
      for (let i=0;i<12;i++) {
        let a = TWO_PI/12*i + PI/12;
        cs.push({ x:cx+r*2.7*cos(a), y:cy+r*2.7*sin(a), layer:3 });
      }
      for (let i=0;i<16;i++) {
        let a = TWO_PI/16*i;
        cs.push({ x:cx+r*3.5*cos(a), y:cy+r*3.5*sin(a), layer:4 });
      }
      return cs;
    }

    // --- 18. Tetrahedron: simplest 3D solid, triangle ---
    function genTetrahedron(cx, cy, r) {
      let cs = [{ x:cx, y:cy, layer:0 }];
      for (let i=0;i<3;i++) {
        let a = TWO_PI/3*i - PI/2;
        cs.push({ x:cx+r*1.6*cos(a), y:cy+r*1.6*sin(a), layer:2 });
      }
      for (let i=0;i<3;i++) {
        let a1 = TWO_PI/3*i - PI/2;
        let a2 = TWO_PI/3*((i+1)%3) - PI/2;
        let mx = (cx+r*1.6*cos(a1) + cx+r*1.6*cos(a2))/2;
        let my = (cy+r*1.6*sin(a1) + cy+r*1.6*sin(a2))/2;
        cs.push({ x:mx, y:my, layer:1 });
      }
      for (let i=0;i<3;i++) {
        let a = TWO_PI/3*i - PI/2;
        cs.push({ x:cx+r*2.7*cos(a), y:cy+r*2.7*sin(a), layer:3 });
      }
      for (let i=0;i<3;i++) {
        let a = TWO_PI/3*i + PI/2;
        cs.push({ x:cx+r*2.4*cos(a), y:cy+r*2.4*sin(a), layer:3 });
      }
      for (let i=0;i<12;i++) {
        let a = TWO_PI/12*i;
        cs.push({ x:cx+r*3.4*cos(a), y:cy+r*3.4*sin(a), layer:4 });
      }
      return cs;
    }

    // --- 19. Cube (hexahedron): square + diagonals + 3D-projected backsquare ---
    function genCube(cx, cy, r) {
      let cs = [{ x:cx, y:cy, layer:0 }];
      let pts = [
        { x:-1, y:-1 }, { x:1, y:-1 }, { x:1, y:1 }, { x:-1, y:1 }
      ];
      for (let p of pts) {
        cs.push({ x:cx+p.x*r*0.8, y:cy+p.y*r*0.8, layer:1 });
      }
      let off = r*0.4;
      for (let p of pts) {
        cs.push({ x:cx+p.x*r*0.8+off, y:cy+p.y*r*0.8-off, layer:2 });
      }
      for (let p of pts) {
        cs.push({ x:cx+p.x*r*1.6, y:cy+p.y*r*1.6, layer:2 });
      }
      for (let i=0;i<12;i++) {
        let a = TWO_PI/12*i + PI/12;
        cs.push({ x:cx+r*2.8*cos(a), y:cy+r*2.8*sin(a), layer:3 });
      }
      for (let i=0;i<16;i++) {
        let a = TWO_PI/16*i;
        cs.push({ x:cx+r*3.5*cos(a), y:cy+r*3.5*sin(a), layer:4 });
      }
      return cs;
    }

    // --- 20. Pentagram: 5-pointed star, nested ---
    function genPentagram(cx, cy, r) {
      let cs = [{ x:cx, y:cy, layer:0 }];
      let sizes = [0.5, 1.0, 1.6, 2.4];
      for (let s=0;s<sizes.length;s++) {
        let sz = r*sizes[s];
        for (let i=0;i<5;i++) {
          let a = TWO_PI/5*i - PI/2;
          cs.push({ x:cx+sz*cos(a), y:cy+sz*sin(a), layer:s+1 });
          let a2 = TWO_PI/5*i - PI/2 + PI/5;
          cs.push({ x:cx+sz*0.382*cos(a2), y:cy+sz*0.382*sin(a2), layer:s+1 });
        }
      }
      for (let i=0;i<10;i++) {
        let a = TWO_PI/10*i;
        cs.push({ x:cx+r*3.3*cos(a), y:cy+r*3.3*sin(a), layer:5 });
      }
      return cs;
    }

    // --- 21. Enneagram: 9 points + inner triangle + hexagon ---
    function genEnneagram(cx, cy, r) {
      let cs = [{ x:cx, y:cy, layer:0 }];
      for (let i=0;i<9;i++) {
        let a = TWO_PI/9*i - PI/2;
        cs.push({ x:cx+r*1.6*cos(a), y:cy+r*1.6*sin(a), layer:2 });
      }
      for (let i=0;i<3;i++) {
        let a = TWO_PI/3*i - PI/2;
        cs.push({ x:cx+r*0.7*cos(a), y:cy+r*0.7*sin(a), layer:1 });
      }
      for (let i=0;i<6;i++) {
        let a = TWO_PI/6*i + PI/6;
        cs.push({ x:cx+r*1.0*cos(a), y:cy+r*1.0*sin(a), layer:1 });
      }
      for (let i=0;i<18;i++) {
        let a = TWO_PI/18*i + PI/18;
        cs.push({ x:cx+r*2.7*cos(a), y:cy+r*2.7*sin(a), layer:3 });
      }
      for (let i=0;i<24;i++) {
        let a = TWO_PI/24*i;
        cs.push({ x:cx+r*3.5*cos(a), y:cy+r*3.5*sin(a), layer:4 });
      }
      return cs;
    }

    // --- 22. Taijitu (yin-yang): two halves, two dots, S-curve ---
    function genTaijitu(cx, cy, r) {
      let cs = [];
      cs.push({ x:cx-r*0.5, y:cy, layer:0 });
      cs.push({ x:cx+r*0.5, y:cy, layer:0 });
      for (let i=0;i<14;i++) {
        let t = map(i,0,13,-1,1);
        let yy = cy + t*r*1.0;
        let xx = cx + sin(t*PI)*r*0.55;
        cs.push({ x:xx, y:yy, layer:1 });
      }
      for (let i=0;i<12;i++) {
        let a = TWO_PI/12*i;
        cs.push({ x:cx+r*1.6*cos(a), y:cy+r*1.6*sin(a), layer:2 });
      }
      for (let i=0;i<18;i++) {
        let a = TWO_PI/18*i + PI/18;
        cs.push({ x:cx+r*2.5*cos(a), y:cy+r*2.5*sin(a), layer:3 });
      }
      for (let i=0;i<24;i++) {
        let a = TWO_PI/24*i;
        cs.push({ x:cx+r*3.4*cos(a), y:cy+r*3.4*sin(a), layer:4 });
      }
      return cs;
    }

    // --- 23. Triskele: three Celtic spirals from one center ---
    function genTriskele(cx, cy, r) {
      let cs = [{ x:cx, y:cy, layer:0 }];
      for (let arm=0; arm<3; arm++) {
        let baseAngle = TWO_PI/3*arm - PI/2;
        for (let i=1; i<=14; i++) {
          let t = i/14;
          let angle = baseAngle + t * PI * 1.4;
          let radius = r * 0.25 + t * r * 1.6;
          cs.push({ x:cx+radius*cos(angle), y:cy+radius*sin(angle), layer:Math.min(4, Math.floor(t*4)+1) });
        }
      }
      for (let i=0;i<3;i++) {
        let a = TWO_PI/3*i - PI/2;
        cs.push({ x:cx+r*0.4*cos(a), y:cy+r*0.4*sin(a), layer:1 });
      }
      for (let i=0;i<15;i++) {
        let a = TWO_PI/15*i;
        cs.push({ x:cx+r*3.3*cos(a), y:cy+r*3.3*sin(a), layer:5 });
      }
      return cs;
    }

    // --- 24. Lotus mandala: 8-petaled lotus, nested ---
    function genLotusMandala(cx, cy, r) {
      let cs = [{ x:cx, y:cy, layer:0 }];
      for (let i=0;i<8;i++) {
        let a = TWO_PI/8*i;
        cs.push({ x:cx+r*0.8*cos(a), y:cy+r*0.8*sin(a), layer:1 });
      }
      for (let i=0;i<8;i++) {
        let a = TWO_PI/8*i + PI/8;
        cs.push({ x:cx+r*1.6*cos(a), y:cy+r*1.6*sin(a), layer:2 });
      }
      for (let i=0;i<16;i++) {
        let a = TWO_PI/16*i;
        cs.push({ x:cx+r*2.4*cos(a), y:cy+r*2.4*sin(a), layer:3 });
      }
      for (let i=0;i<24;i++) {
        let a = TWO_PI/24*i + PI/24;
        cs.push({ x:cx+r*3.3*cos(a), y:cy+r*3.3*sin(a), layer:4 });
      }
      return cs;
    }

    function genForType(idx) {
      let cx=width/2, cy=height/2;
      let r = geoRadius;
      switch(idx) {
        case 0: return genFlowerOfLife(cx,cy,r,geoLayers);
        case 1: return genSeedOfLife(cx,cy,r*1.3);
        case 2: return genMetatronsCube(cx,cy,r);
        case 3: return genMerkaba(cx,cy,r*0.9);
        case 4: return genTorusField(cx,cy,r);
        case 5: return genVesicaPiscis(cx,cy,r*1.2);
        case 6: return genSriYantra(cx,cy,r*0.85);
        case 7: return genIcosahedron(cx,cy,r*1.1);
        case 8: return genGoldenSpiral(cx,cy,r);
        case 9: return gen64Tetrahedron(cx,cy,r*0.8);
        case 10: return genTreeOfLife(cx,cy,r*1.1);
        case 11: return genGordianKnot(cx,cy,r*1.0);
        case 12: return genEggOfLife(cx,cy,r*1.05);
        case 13: return genFruitOfLife(cx,cy,r*1.05);
        case 14: return genVectorEquilibrium(cx,cy,r);
        case 15: return genDodecahedron(cx,cy,r*1.05);
        case 16: return genOctahedron(cx,cy,r);
        case 17: return genTetrahedron(cx,cy,r*0.95);
        case 18: return genCube(cx,cy,r*1.0);
        case 19: return genPentagram(cx,cy,r*1.0);
        case 20: return genEnneagram(cx,cy,r*1.0);
        case 21: return genTaijitu(cx,cy,r*1.1);
        case 22: return genTriskele(cx,cy,r*1.0);
        case 23: return genLotusMandala(cx,cy,r);
        default: return genFlowerOfLife(cx,cy,r,geoLayers);
      }
    }

    function initAudio() {
      if (audioReady) return;
      audioReady = true;

      try {
        if (Tone.context.state !== 'running') {
          var AC = window.AudioContext || window.webkitAudioContext;
          if (AC) {
            var freshCtx = new AC();
            Tone.setContext(freshCtx);
          }
        }
      } catch(e) {}

      try {
        if (Tone.context && Tone.context.rawContext) {
          Tone.context.rawContext.resume();
        }
      } catch(e) {}

      Tone.start().then(function() {
        setupAudioGraph();
      }).catch(function() {
        setTimeout(function() { setupAudioGraph(); }, 100);
      });

      setTimeout(function() {
        try {
          if (Tone.context && Tone.context.rawContext && Tone.context.rawContext.state !== 'running') {
            Tone.context.rawContext.resume();
          }
        } catch(e) {}
        if (!audioLoaded) setupAudioGraph();
      }, 300);

      setTimeout(function() {
        if (!audioLoaded) setupAudioGraph();
      }, 800);

      setTimeout(function() {
        if (!audioLoaded) setupAudioGraph();
      }, 1500);
    }

    function enterExperience() {
      if (started) return;
      if (!audioReady) initAudio();
      // Give the BGM a beat to swell before flipping into the experience —
      // so the cover is actually heard with sound for a moment.
      var enterDelay = audioLoaded ? 1200 : 1800;
      setTimeout(function() { _completeEnter(); }, enterDelay);
    }
    function _completeEnter() {
      if (started) return;
      started = true;
      var ov = document.getElementById('startOverlay');
      if (ov) {
        ov.style.opacity = '0';
        setTimeout(function() { ov.style.display = 'none'; }, 2700);
      }
      var info = document.getElementById('info');
      if (info) {
        info.style.opacity = '1';
        setTimeout(function() { info.style.opacity = '0'; }, 6000);
      }
      var changeHint = document.getElementById('changeHint');
      if (changeHint) {
        setTimeout(function() { changeHint.classList.add('visible'); }, 900);
      }
      showLabel(currentType);
      showMessage(currentType);
    }

    function setupAudioGraph() {
      if (audioLoaded) return;

      try {
        if (Tone.context.state === 'suspended') {
          Tone.context.rawContext.resume();
        }
      } catch(e) {}

      try {
        reverbNode = new Tone.Reverb({ decay: 12, wet: 0.7 });
        reverbNode.toDestination();
      } catch(e) {
        reverbNode = new Tone.Gain(0.9).toDestination();
      }

      masterGain = new Tone.Gain(0.85).connect(reverbNode);

      for (var i = 0; i < 8; i++) {
        try {
          var s = new Tone.Synth({
            oscillator: { type: 'sine' },
            envelope: { attack: 0.005, decay: 4, sustain: 0, release: 5 }, volume: -14,
          }).connect(masterGain);
          bellPool.push({ synth: s, busy: false, lastT: 0 });
        } catch(e) {}
      }

      try {
        dFilter = new Tone.Filter({ frequency: 350, type: 'lowpass', rolloff: -24 }).connect(masterGain);
        dGain = new Tone.Gain(0).connect(dFilter);
        dSynth = new Tone.Synth({ oscillator:{type:'sine'},
          envelope:{attack:3,decay:0,sustain:1,release:4}, volume:-18 }).connect(dGain);
        dHarm = new Tone.Synth({ oscillator:{type:'sine'},
          envelope:{attack:4,decay:0,sustain:1,release:4}, volume:-24 }).connect(dGain);

        var t = TYPES[currentType];
        dSynth.triggerAttack(t.droneFreq);
        dHarm.triggerAttack(t.droneFreq * 2);
      } catch(e) {}

      try {
        var ambReverb;
        try {
          ambReverb = new Tone.Reverb({ decay: 15, wet: 0.85 });
          ambReverb.toDestination();
        } catch(e) {
          ambReverb = new Tone.Gain(0.8).toDestination();
        }

        ambPadFilter = new Tone.Filter({ frequency: 600, type: 'lowpass', rolloff: -12 }).connect(ambReverb);
        ambPadGain = new Tone.Gain(0.18).connect(ambPadFilter);
        ambPad1 = new Tone.Synth({
          oscillator: { type: 'triangle' },
          envelope: { attack: 6, decay: 2, sustain: 0.7, release: 8 }, volume: -16
        }).connect(ambPadGain);
        ambPad2 = new Tone.Synth({
          oscillator: { type: 'sine' },
          envelope: { attack: 8, decay: 3, sustain: 0.6, release: 10 }, volume: -20
        }).connect(ambPadGain);

        ambMelodyGain = new Tone.Gain(0.12).connect(ambReverb);
        ambMelody = new Tone.Synth({
          oscillator: { type: 'sine' },
          envelope: { attack: 0.8, decay: 3, sustain: 0, release: 6 }, volume: -18
        }).connect(ambMelodyGain);

        var t = TYPES[currentType];
        ambPad1.triggerAttack(t.droneFreq * t.padRatio[0]);
        ambPad2.triggerAttack(t.droneFreq * t.padRatio[1]);

        startAmbientMelody();
      } catch(e) {}

      // Continuous background chord-pad music — runs always
      try {
        try {
          bgmReverb = new Tone.Reverb({ decay: 18, wet: 0.92 });
          bgmReverb.toDestination();
        } catch(e) {
          bgmReverb = new Tone.Gain(0.7).toDestination();
        }
        bgmFilter = new Tone.Filter({ frequency: 850, type: 'lowpass', rolloff: -12 }).connect(bgmReverb);
        bgmGain = new Tone.Gain(0.0).connect(bgmFilter);

        // Three voices: bass triangle, mid sine, upper sine — gentle wash
        var voiceConfigs = [
          { type: 'triangle', vol: -20, atk: 6, rel: 8 },
          { type: 'sine',     vol: -22, atk: 8, rel: 10 },
          { type: 'sine',     vol: -26, atk: 10, rel: 12 }
        ];
        for (var vi = 0; vi < voiceConfigs.length; vi++) {
          var vc = voiceConfigs[vi];
          var v = new Tone.Synth({
            oscillator: { type: vc.type },
            envelope: { attack: vc.atk, decay: 2, sustain: 0.85, release: vc.rel },
            volume: vc.vol
          }).connect(bgmGain);
          bgmVoices.push(v);
        }

        startBackgroundMusic();
        // Swell in noticeably so the cover screen has clear music
        bgmGain.gain.rampTo(0.28, 3.5);
      } catch(e) {}

      audioLoaded = true;
    }

    function startBackgroundMusic() {
      if (bgmInterval) { clearInterval(bgmInterval); bgmInterval = null; }
      function applyChord() {
        var chord = BGM_CHORDS[bgmChordIdx];
        for (var i = 0; i < bgmVoices.length && i < chord.length; i++) {
          var v = bgmVoices[i];
          if (!bgmStarted) {
            try { v.triggerAttack(chord[i]); } catch(e) {}
          } else {
            try { v.frequency.rampTo(chord[i], 5); } catch(e) {}
          }
        }
        bgmStarted = true;
        bgmChordIdx = (bgmChordIdx + 1) % BGM_CHORDS.length;
      }
      applyChord();
      bgmInterval = setInterval(applyChord, BGM_CHORD_MS);
    }

    function startAmbientMelody() {
      if (ambInterval) { clearTimeout(ambInterval); ambInterval = null; }
      function playNote() {
        if (!audioLoaded || !ambMelody) return;
        var t = TYPES[currentType];
        var range = t.melodyRange || [4, 7];
        var melodyNotes = t.bowlTuning.slice(range[0], range[1] + 1);
        var palette = melodyNotes.concat(melodyNotes.map(function(f) { return f * 2; }));
        var freq = palette[Math.floor(Math.random() * palette.length)];
        var vel = 0.3 + Math.random() * 0.4;
        ambMelody.volume.value = -22 + vel * 8;
        ambMelody.triggerAttackRelease(freq, '2n');
      }
      function scheduleNext() {
        var delay = 2200 + Math.random() * 4500;
        ambInterval = setTimeout(function() {
          playNote();
          scheduleNext();
        }, delay);
      }
      setTimeout(function() { playNote(); scheduleNext(); }, 2500);
    }

    function switchDrone(idx) {
      if (!audioLoaded) return;
      var t = TYPES[idx];
      dSynth.frequency.rampTo(t.droneFreq, 2);
      dHarm.frequency.rampTo(t.droneFreq * 2, 2);
      if (ambPad1) ambPad1.frequency.rampTo(t.droneFreq * t.padRatio[0], 4);
      if (ambPad2) ambPad2.frequency.rampTo(t.droneFreq * t.padRatio[1], 4);
      startAmbientMelody();
    }

    function triggerBell(freq, vel) {
      var now = Tone.now();
      for (var i = 0; i < bellPool.length; i++) {
        var b = bellPool[i];
        if (!b.busy || (now - b.lastT > 2.5)) {
          b.busy = true; b.lastT = now;
          b.synth.volume.value = -18 + vel * 14;
          b.synth.triggerAttackRelease(freq, '2n', now);
          (function(bb, f, v) {
            setTimeout(function() { bb.synth.volume.value = -24+v*10; bb.synth.triggerAttackRelease(f*2.003,'4n'); }, 25+Math.random()*40);
            setTimeout(function() { bb.synth.volume.value = -30+v*7; bb.synth.triggerAttackRelease(f*3.01,'8n'); }, 60+Math.random()*60);
            setTimeout(function() { bb.busy = false; }, 3000);
          })(b, freq, vel);
          return;
        }
      }
    }

    function triggerChime(idx) {
      if (!audioLoaded) return;
      var t = TYPES[idx];
      for (var i = 0; i < 4; i++) {
        (function(note, v) {
          setTimeout(function() { triggerBell(note, v); }, i * 180);
        })(t.bowlTuning[i], 0.6 + i * 0.1);
      }
    }

    function easeInCubic(t) { return t * t * t; }
    function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
    function easeInOutCubic(t) { return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2; }
    function easeOutQuart(t) { return 1 - Math.pow(1 - t, 4); }
    function easeInOutQuint(t) { return t < 0.5 ? 16*t*t*t*t*t : 1 - Math.pow(-2*t+2, 5)/2; }
    function easeOutElastic(t) {
      if (t === 0 || t === 1) return t;
      return Math.pow(2, -10*t) * Math.sin((t - 0.075) * (2*Math.PI) / 0.3) + 1;
    }
    function easeOutBack(t) {
      var c = 1.70158;
      return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2);
    }

    function startMorph() {
      if (isMorphing) return;
      var next;
      do { next = Math.floor(Math.random() * TYPES.length); } while (next === currentType);
      nextType = next;
      isMorphing = true; transProgress = 0;
      oldScale = 1; newScale = 0; oldAlpha = 1; newAlpha = 0;
      oldGeo = geoCircles.slice();
      newGeo = genForType(nextType);
      switchDrone(nextType);
      triggerChime(nextType);
      haptic('transform');
      showLabel(nextType);
      showMessage(nextType);
    }

    function tickMorph() {
      if (!isMorphing) return;
      transProgress += morphSpeed;

      var oldT = Math.min(1, transProgress * 1.3);
      oldScale = Math.max(0, 1 - easeInCubic(oldT));
      oldAlpha = Math.max(0, 1 - easeInOutCubic(Math.min(1, transProgress * 1.5)));

      var rawNT = Math.max(0, transProgress - 0.15) / 0.85;
      var nt = Math.min(1, rawNT);
      newScale = easeOutBack(nt);
      newAlpha = easeOutCubic(Math.min(1, rawNT * 1.4));

      if (transProgress >= 1.15) {
        isMorphing = false;
        currentType = nextType;
        geoCircles = newGeo;
        oldGeo = []; newGeo = [];
      }
    }

    function drawSacredGeo(cList, typeIdx, scl, alph, mx, my) {
      if (cList.length === 0 || alph < 0.01 || scl < 0.01) return;
      var typ = TYPES[typeIdx];
      var cx = width/2, cy = height/2;
      var maxL = 0;
      for (var k = 0; k < cList.length; k++) if (cList[k].layer > maxL) maxL = cList[k].layer;

      var ptrIsActive = ptrDown || !isMobile;
      var interactionRadius = isMobile ? geoRadius * 6 : geoRadius * 5;

      for (var i = 0; i < cList.length; i++) {
        for (var j = i+1; j < cList.length; j++) {
          var ci = cList[i], cj = cList[j];
          var ix = cx+(ci.x-cx)*scl, iy = cy+(ci.y-cy)*scl;
          var jx = cx+(cj.x-cx)*scl, jy = cy+(cj.y-cy)*scl;
          var dd = dist(ix,iy,jx,jy);
          if (dd < geoRadius*scl*1.3 && dd > geoRadius*scl*0.3) {
            var midX = (ix+jx)/2, midY = (iy+jy)/2;
            var md = ptrIsActive ? dist(mx,my,midX,midY) : 9999;
            var pr = constrain(map(md, 0, geoRadius*4, 1, 0), 0, 1);
            if (!ptrIsActive) pr = 0;
            pr = easeInOutCubic(pr);
            // Higher base alpha so the lattice is visible even when pointer is far
            var al = (22 + pr*55) * alph;
            var hv = (typ.hueBase + map(midX+midY,0,width+height,-30,30) + animTime*20) % 360;
            if (hv < 0) hv += 360;
            colorMode(HSB, 360, 100, 100, 100);
            // Higher minimum saturation/brightness for vibrancy at rest
            var connSat = Math.min(100, Math.max(typ.sat[0] + 18, 60) + pr*22);
            var connBri = Math.min(100, Math.max(typ.bri[0] + 22, 70) + pr*24);
            stroke(hv, connSat, connBri, al);
            strokeWeight(Math.max(0.5, (0.55+pr*0.8)*scl));
            line(ix, iy, jx, jy);
          }
        }
      }

      var nowMs = millis();
      for (var i = 0; i < cList.length; i++) {
        var c = cList[i];
        var sx = cx+(c.x-cx)*scl, sy = cy+(c.y-cy)*scl;
        var md = ptrIsActive ? dist(mx, my, sx, sy) : 9999;
        var pr = constrain(map(md, 0, interactionRadius, 1, 0), 0, 1);
        if (!ptrIsActive) pr = 0;
        pr = easeInOutCubic(pr);
        var dfc = dist(c.x, c.y, cx, cy);
        var nd = maxL > 0 ? c.layer/maxL : 0;

        if (audioLoaded && ptrIsActive && scl > 0.8 && alph > 0.7 && pr > 0.5 && ptrSpeed > 1.0 && (nowMs-lastBellMs) > bellGap) {
          var ni = Math.floor(map(nd, 0, 1, 0, typ.bowlTuning.length-1));
          ni = constrain(ni, 0, typ.bowlTuning.length-1);
          var vel = constrain(map(ptrSpeed, 1.0, 25, 0.15, 1), 0.15, 1);
          triggerBell(typ.bowlTuning[ni], vel);
          haptic('light');
          lastBellMs = nowMs;
        }

        var breathe = sin(animTime*2 + dfc*0.01) * geoRadius*0.04*scl;
        var hover = pr * geoRadius*0.15*scl;
        var rr = geoRadius*scl + breathe + hover;

        colorMode(HSB, 360, 100, 100, 100);
        var bh = typ.hueBase + map(nd, 0, 1, -typ.hueRange/2, typ.hueRange/2);
        var hv = (bh + sin(animTime+i*0.1)*20 + pr*30) % 360;
        if (hv < 0) hv += 360;
        // Lift the rest-state saturation and brightness floors for vibrancy
        var sv = Math.min(100, Math.max(typ.sat[0] + 15, 60) + pr*(typ.sat[1]-typ.sat[0]));
        var bv = Math.min(100, Math.max(typ.bri[0] + 18, 75) + pr*(typ.bri[1]-typ.bri[0]));
        // Higher base alpha so circles are clearly visible even when not hovered
        var al = (42 + pr*45 + sin(animTime*1.5+i*0.3)*12) * alph;

        // Always draw a soft outer glow (not just when hovered) — gives the geometry
        // a gentle luminescent presence even at rest.
        noFill(); stroke(hv, sv*0.7, bv, al*(pr > 0.1 ? 0.32 : 0.18));
        strokeWeight(Math.max(0.6, (1.6 + pr*5)*scl));
        ellipse(sx, sy, rr*2, rr*2);

        noFill(); stroke(hv, sv, bv, al);
        strokeWeight(Math.max(0.7, (1.0+pr*1.6)*scl));
        ellipse(sx, sy, rr*2, rr*2);

        if (pr > 0.3) {
          fill(hv, sv*0.5, 100, (pr-0.3)*12*alph);
          noStroke(); ellipse(sx, sy, rr*1.2, rr*1.2);
        }
        if (pr > 0.5) {
          fill(hv, 30, 100, (pr-0.5)*160*alph);
          noStroke(); ellipse(sx, sy, (2+pr*3)*scl, (2+pr*3)*scl);
        }
      }
    }

    function setup() {
      var c = createCanvas(windowWidth, windowHeight);

      var el = c.elt;
      el.addEventListener('touchstart', onTouchStart, { passive: false });
      el.addEventListener('touchmove', onTouchMove, { passive: false });
      el.addEventListener('touchend', onTouchEnd, { passive: false });
      el.addEventListener('touchcancel', onTouchEnd, { passive: false });

      noFill();
      geoRadius = isMobile ? Math.min(width, height) * 0.105 : Math.min(width, height) * 0.085;

      if (CAPTURE_MODE) {
        currentType = CAPTURE_GEO;
        started = true;
        var ov = document.getElementById('startOverlay');
        if (ov) ov.style.display = 'none';
        var info = document.getElementById('info');
        if (info) info.style.opacity = CAPTURE_NO_UI ? '0' : '1';
        // Settle to a deterministic animTime for consistent shots
        animTime = 1.2;
        // Disable transitions so text appears at final color immediately
        var captureStyle = document.createElement('style');
        captureStyle.textContent = '#universeMessage, #changeHint, #typeName, #info, #messageBackdrop { transition: none !important; }' +
          // Scale text up so it reads well in retina captures
          '#universeMessage { font-size: 30px !important; max-width: 760px !important; line-height: 2.0 !important; letter-spacing: 3px !important; }' +
          '#typeName { font-size: 24px !important; letter-spacing: 6px !important; top: 44px !important; }' +
          '#changeHint { font-size: 18px !important; letter-spacing: 6px !important; }' +
          '#messageBackdrop { width: 960px !important; height: 520px !important; }' +
          '#universeMessage.visible { color: rgba(255,255,255,0.92) !important; }' +
          '#changeHint.visible { color: rgba(255,255,255,0.55) !important; animation: none !important; }' +
          '#typeName { color: rgba(255,255,255,0.75) !important; }' +
          '#messageBackdrop.visible { opacity: 1 !important; }';
        document.head.appendChild(captureStyle);
      }

      geoCircles = genForType(currentType);
      makeStars();
      positionChangeHint();

      if (CAPTURE_MODE) {
        showLabel(currentType);
        // Force the message visible immediately (skip the 800ms inner delay)
        var um = document.getElementById('universeMessage');
        var bd = document.getElementById('messageBackdrop');
        var msg = TYPES[currentType].message;
        var html = '';
        for (var i = 0; i < msg.length; i++) {
          var ch = msg[i];
          if (ch === '\n') html += '<br>';
          else if (ch === ' ') html += ' ';
          else html += '<span class="ch">' + ch + '</span>';
        }
        um.innerHTML = html;
        um.classList.add('visible');
        if (bd) bd.classList.add('visible');
        var chHint = document.getElementById('changeHint');
        if (chHint) chHint.classList.add('visible');
        if (CAPTURE_NO_UI) {
          if (um) um.style.display = 'none';
          if (bd) bd.style.display = 'none';
          if (chHint) chHint.style.display = 'none';
          var tn = document.getElementById('typeName'); if (tn) tn.style.display = 'none';
        }
      }
    }

    function positionChangeHint() {
      var ch = document.getElementById('changeHint');
      if (!ch) return;
      // Place the hint just below the geometry's outer ring with a small gap.
      var geoOuterRadius = geoRadius * geoLayers * 1.15;
      var centerY = window.innerHeight / 2;
      var hintTop = centerY + geoOuterRadius + (isMobile ? 28 : 36);
      // Clamp so it never collides with the bottom info bar
      var maxTop = window.innerHeight - 64;
      if (hintTop > maxTop) hintTop = maxTop;
      ch.style.top = hintTop + 'px';
    }

    function showLabel(idx) {
      var el = document.getElementById('typeName');
      el.textContent = TYPES[idx].name;
      el.style.color = 'rgba(255,255,255,0.5)';
      setTimeout(function() { el.style.color = 'rgba(255,255,255,0)'; }, 4000);
    }

    function showMessage(idx) {
      var el = document.getElementById('universeMessage');
      var bd = document.getElementById('messageBackdrop');
      el.classList.remove('visible');
      el.classList.remove('glow');
      if (bd) bd.classList.remove('visible');
      setTimeout(function() {
        var msg = TYPES[idx].message;
        var html = '';
        for (var i = 0; i < msg.length; i++) {
          var ch = msg[i];
          if (ch === '\n') {
            html += '<br>';
          } else if (ch === ' ') {
            html += ' ';
          } else {
            html += '<span class="ch">' + ch + '</span>';
          }
        }
        el.innerHTML = html;
        el.classList.add('visible');
        if (bd) bd.classList.add('visible');
      }, 800);
    }

    function updateMessageTilt() {
      var el = document.getElementById('universeMessage');
      if (!el) return;

      var rect = el.getBoundingClientRect();
      var elCX = rect.left + rect.width / 2;
      var elCY = rect.top + rect.height / 2;
      var elW = rect.width;
      var elH = rect.height;

      var dx = ptrX - elCX;
      var dy = ptrY - elCY;
      var inX = Math.abs(dx) < elW * 0.75;
      var inY = Math.abs(dy) < elH * 0.75;
      var isNear = inX && inY && (ptrDown || !isMobile);

      if (isNear) {
        var nx = dx / (elW * 0.75);
        var ny = dy / (elH * 0.75);
        var targetTX = -ny * 8;
        var targetTY = nx * 8;
        msgTiltX += (targetTX - msgTiltX) * 0.08;
        msgTiltY += (targetTY - msgTiltY) * 0.08;
        msgScaleTarget = 1.04;

        if (!msgIsHovered) {
          el.classList.add('glow');
          msgIsHovered = true;
        }

        var chars = el.querySelectorAll('.ch');
        for (var i = 0; i < chars.length; i++) {
          var sp = chars[i];
          var sr = sp.getBoundingClientRect();
          var scx = sr.left + sr.width / 2;
          var scy = sr.top + sr.height / 2;
          var cdx = ptrX - scx;
          var cdy = ptrY - scy;
          var cdist = Math.sqrt(cdx * cdx + cdy * cdy);
          var lensR = isMobile ? 100 : 120;
          if (cdist < lensR) {
            var t = 1 - cdist / lensR;
            var bulge = easeOutCubic(t);
            var s = 1 + bulge * 0.35;
            var z = bulge * 12;
            sp.style.transform = 'scale(' + s.toFixed(3) + ') translateZ(' + z.toFixed(1) + 'px)';
            sp.style.opacity = (0.85 + bulge * 0.15).toFixed(2);
          } else {
            sp.style.transform = 'scale(1) translateZ(0px)';
            sp.style.opacity = '';
          }
        }
      } else {
        msgTiltX += (0 - msgTiltX) * 0.05;
        msgTiltY += (0 - msgTiltY) * 0.05;
        msgScaleTarget = 1;

        if (msgIsHovered) {
          el.classList.remove('glow');
          msgIsHovered = false;
          var chars = el.querySelectorAll('.ch');
          for (var i = 0; i < chars.length; i++) {
            chars[i].style.transform = 'scale(1) translateZ(0px)';
            chars[i].style.opacity = '';
          }
        }
      }

      msgScale += (msgScaleTarget - msgScale) * 0.06;

      var breathScale = 1 + Math.sin(animTime * 0.6) * 0.015;
      var breathY = Math.sin(animTime * 0.8) * 3;
      var breathR = Math.sin(animTime * 0.5) * 0.3;
      var totalScale = msgScale * breathScale;

      el.style.transform = 'translate(-50%, -50%) perspective(800px) rotateX(' +
        (msgTiltX + breathR).toFixed(2) + 'deg) rotateY(' +
        msgTiltY.toFixed(2) + 'deg) translateY(' +
        breathY.toFixed(1) + 'px) scale(' +
        totalScale.toFixed(4) + ')';
    }

    function makeStars() {
      stars = [];
      for (var i = 0; i < starCount; i++) {
        stars.push(makeStar(true));
      }
    }

    function makeStar(randomZ) {
      var angle = random(TWO_PI);
      // tiny, uniform initial offset so all stars emerge from a single point at the center
      var spread = 0.025;
      var z = randomZ ? random(0.05, 0.985) : random(0.85, 0.985);
      return {
        nx: cos(angle) * spread,
        ny: sin(angle) * spread,
        z: z,
        sz: random(0.2, 1.0),
        br: random(100, 255),
        tSpd: random(0.5, 3),
        tOff: random(TWO_PI),
        temp: random(0, 1),
        prevSX: 0, prevSY: 0, hasPrev: false
      };
    }

    var burstAngles = [], burstHueOff = [];
    for (var i = 0; i < 20; i++) {
      burstAngles.push(Math.PI*2/20*i);
      burstHueOff.push(Math.random()*40-20);
    }

    function draw() {
      background(0);
      animTime += 0.008;

      ptrSpeed = dist(ptrX, ptrY, prevPX, prevPY);
      prevPX = ptrX; prevPY = ptrY;

      if (!isMobile) {
        ptrX = mouseX; ptrY = mouseY;
        ptrDown = true;
      }

      // Capture mode override — deterministic pointer for screenshots
      if (CAPTURE_MODE) {
        if (CAPTURE_HOVER) {
          ptrX = width / 2; ptrY = height / 2;
          ptrDown = true;
        } else {
          ptrX = -10000; ptrY = -10000;
          ptrDown = false;
        }
      }

      tickMorph();

      var cx0 = width / 2, cy0 = height / 2;
      var isActive = ptrDown || !isMobile;
      if (isActive && ptrX > 0 && ptrY > 0) {
        var nx = (ptrX - cx0) / cx0;
        var ny = (ptrY - cy0) / cy0;
        var edgeFactor = easeInCubic(Math.min(1, Math.sqrt(nx*nx + ny*ny)));
        tiltTargetY = nx * edgeFactor * maxTiltDeg;
        tiltTargetX = -ny * edgeFactor * maxTiltDeg;
      } else {
        tiltTargetX = 0;
        tiltTargetY = 0;
      }
      tiltX += (tiltTargetX - tiltX) * tiltLerp;
      tiltY += (tiltTargetY - tiltY) * tiltLerp;
      var canvasEl = document.querySelector('canvas');
      if (canvasEl) {
        canvasEl.style.transform = 'perspective(1200px) rotateX(' + tiltX.toFixed(3) + 'deg) rotateY(' + tiltY.toFixed(3) + 'deg)';
      }

      updateMessageTilt();

      if (audioLoaded && dGain) {
        if (started) {
          var cd = dist(ptrX, ptrY, width/2, height/2);
          dGain.gain.rampTo(constrain(map(cd, 0, geoRadius*geoLayers*1.5, 0.5, 0.03), 0.03, 0.5), 0.4);
          dFilter.frequency.rampTo(map(ptrY, 0, height, 700, 180), 0.6);
        } else {
          // Cover-state ambient: very gentle, just a whisper of low drone
          var coverGain = 0.14 + Math.sin(animTime * 0.4) * 0.02;
          dGain.gain.rampTo(coverGain, 2.0);
          dFilter.frequency.rampTo(360, 2.5);
        }
      }
      // Light/full mode for the BGM and ambient pads (lighter while on cover)
      if (audioLoaded) {
        if (bgmGain) bgmGain.gain.rampTo(started ? 0.28 : 0.18, 1.2);
        if (ambPadGain) ambPadGain.gain.rampTo(started ? 0.18 : 0.10, 1.2);
        if (ambMelodyGain) ambMelodyGain.gain.rampTo(started ? 0.12 : 0.05, 1.2);
      }

      colorMode(RGB); noStroke();
      var hcx = width/2, hcy = height/2;
      var flowerZone = geoRadius * (geoLayers + 1.5);
      var warpSpeed = (0.0011 + (isMobile ? 0.0005 : 0.0008)) * (started ? 1.0 : 1.15);

      for (var i = stars.length - 1; i >= 0; i--) {
        var s = stars[i];

        s.z -= warpSpeed * (1.0 - s.z * 0.3);

        var perspective = 1.0 / Math.max(0.01, s.z);
        var screenX = hcx + s.nx * perspective * width * 0.35;
        var screenY = hcy + s.ny * perspective * height * 0.35;

        var appSz = s.sz * perspective * 0.15;
        appSz = Math.min(appSz, 5);

        if (s.z <= 0.01 || screenX < -100 || screenX > width + 100 ||
            screenY < -100 || screenY > height + 100) {
          stars[i] = makeStar(false);
          continue;
        }

        var dc = dist(screenX, screenY, hcx, hcy);
        var fade = dc < flowerZone ? map(dc, 0, flowerZone, 0.02, 0.5) : 1;

        var tw = s.z > 0.5 ? (sin(animTime * s.tSpd + s.tOff) * 0.3 + 0.7) : 1;

        var zBright = easeOutCubic(1 - s.z);
        var al = s.br * fade * tw * (0.15 + zBright * 0.85);

        var warmth = (1 - s.z) * s.temp;
        var cr = 190 + warmth * 65;
        var cg = 200 + warmth * 40;
        var cb = 255 - warmth * 40;

        if (isActive) {
          var md = dist(ptrX, ptrY, screenX, screenY);
          if (md < 150) {
            var mg = easeOutCubic(constrain(map(md, 0, 120, 1, 0), 0, 1)) * 0.4;
            al += s.br * mg;
            appSz *= (1 + mg * 0.5);
          }
        }

        if (s.hasPrev && s.z < (started ? 0.65 : 0.97)) {
          var trailBoost = started ? 0.45 : 1.3;
          var streakAlpha = al * easeOutCubic(1 - s.z) * 1.25 * trailBoost;
          var dx = screenX - s.prevSX;
          var dy = screenY - s.prevSY;
          var streakLen = Math.sqrt(dx*dx + dy*dy);

          if (streakLen > 0.15) {
            var stretchBase = isMobile ? 7 : 11;
            var stretch = stretchBase * trailBoost;
            var tailX = screenX - dx * stretch;
            var tailY = screenY - dy * stretch;

            stroke(cr, cg, cb, streakAlpha);
            strokeWeight(Math.min(Math.max(0.6, appSz * 0.6), 2.6));
            line(tailX, tailY, screenX, screenY);

            if (s.z < 0.55) {
              stroke(cr, cg, cb, Math.min(255, streakAlpha * 1.4));
              strokeWeight(Math.min(Math.max(0.8, appSz * 0.8), 3.2));
              var headTailX = screenX - dx * (stretch * 0.35);
              var headTailY = screenY - dy * (stretch * 0.35);
              line(headTailX, headTailY, screenX, screenY);
            }
            noStroke();
          }
        }

        s.prevSX = screenX;
        s.prevSY = screenY;
        s.hasPrev = true;

        fill(cr, cg, cb, al);
        ellipse(screenX, screenY, appSz, appSz);

        if (appSz > 1.2 && s.z < 0.4) {
          fill(cr, cg, cb, al * 0.06);
          ellipse(screenX, screenY, appSz * 3.5, appSz * 3.5);
        }
      }

      while (stars.length < starCount) {
        stars.push(makeStar(false));
      }

      var mx = ptrX, my = ptrY;
      var cx = width/2, cy = height/2;

      if (!started) return;

      if (isMorphing) {
        drawSacredGeo(oldGeo, currentType, oldScale, oldAlpha, mx, my);
        drawSacredGeo(newGeo, nextType, newScale, newAlpha, mx, my);
      } else {
        drawSacredGeo(geoCircles, currentType, 1, 1, mx, my);
      }

      var activeType = (isMorphing && newAlpha > 0.5) ? nextType : currentType;
      var typ = TYPES[activeType];
      colorMode(HSB, 360, 100, 100, 100);
      var cd2 = isActive ? dist(mx, my, cx, cy) : 9999;
      var cp = easeInOutCubic(constrain(map(cd2, 0, geoRadius*3, 1, 0), 0, 1));
      var gs = geoRadius*3 + sin(animTime*1.5)*geoRadius*0.5 + cp*geoRadius*2;
      for (var g = 3; g > 0; g--) {
        fill(typ.hueBase, 50, 90, (6+cp*12)/g);
        noStroke();
        ellipse(cx, cy, gs*g*0.7, gs*g*0.7);
      }

      noFill();
      var oh = (typ.hueBase + 40 + animTime*15) % 360;
      stroke(oh, 65, 80, 28 + sin(animTime)*8);
      strokeWeight(1.2);
      var outerR = geoRadius * geoLayers * 2.2;
      if (isMorphing) outerR *= Math.max(0.3, oldScale*oldAlpha + newScale*newAlpha);
      ellipse(cx, cy, outerR, outerR);

      if (isActive && ptrX > 0 && ptrY > 0) {
        colorMode(RGB); noStroke();
        var curSz = isMobile ? 44 : 24;
        var dotSz = isMobile ? 10 : 5;
        fill(255, 255, 255, 12);
        ellipse(mx, my, curSz, curSz);
        fill(255, 255, 255, 35);
        ellipse(mx, my, dotSz, dotSz);
      }

      if (isMorphing && transProgress < 0.5) {
        colorMode(HSB, 360, 100, 100, 100);
        var ba = easeOutCubic(1 - transProgress/0.5) * 80;
        var ntType = TYPES[nextType];
        for (var i = 0; i < 20; i++) {
          var ang = burstAngles[i] + animTime*3;
          var br = geoRadius*2*transProgress*4;
          var bx = cx+br*cos(ang), by = cy+br*sin(ang);
          var bHue = (ntType.hueBase + burstHueOff[i] + 360) % 360;
          fill(bHue, 60, 90, ba);
          noStroke();
          ellipse(bx, by, 3, 3);
        }
      }
    }

    function onTouchStart(e) {
      e.preventDefault();
      e.stopPropagation();
      if (e.touches.length > 0) {
        var t = e.touches[0];
        ptrX = t.clientX;
        ptrY = t.clientY;
        prevPX = ptrX;
        prevPY = ptrY;
        ptrDown = true;
        tapStartPos = { x: t.clientX, y: t.clientY };
        tapStartTime = Date.now();
        didDrag = false;

        try {
          if (Tone.context && Tone.context.rawContext) {
            var state = Tone.context.rawContext.state;
            if (state === 'suspended' || state === 'interrupted') {
              Tone.context.rawContext.resume();
            }
          }
        } catch(ex) {}

        if (audioReady && !audioLoaded) {
          try { setupAudioGraph(); } catch(ex) {}
        }
      }
    }

    function onTouchMove(e) {
      e.preventDefault();
      e.stopPropagation();
      if (e.touches.length > 0) {
        var t = e.touches[0];
        ptrX = t.clientX;
        ptrY = t.clientY;
        ptrDown = true;
        if (dist(tapStartPos.x, tapStartPos.y, t.clientX, t.clientY) > 15) {
          didDrag = true;
        }
      }
    }

    function onTouchEnd(e) {
      e.preventDefault();
      e.stopPropagation();
      ptrDown = false;

      try {
        if (Tone.context && Tone.context.rawContext) {
          var state = Tone.context.rawContext.state;
          if (state === 'suspended' || state === 'interrupted') {
            Tone.context.rawContext.resume();
          }
        }
      } catch(ex) {}

      var now = Date.now();
      var elapsed = now - tapStartTime;

      if (elapsed < 400 && !didDrag) {
        haptic('medium');

        if (!started) {
          enterExperience();
        } else {
          if (!audioLoaded) {
            try { setupAudioGraph(); } catch(ex) {}
          }
          startMorph();
        }
      }

      setTimeout(function() {
        if (!ptrDown) {
          ptrX = -1000;
          ptrY = -1000;
        }
      }, 250);
    }

    function mousePressed() {
      if (isMobile) return;
      var now = Date.now();
      if (now - lastDesktopClick < 200) return;
      lastDesktopClick = now;
      if (!started) {
        enterExperience();
      } else {
        startMorph();
      }
    }

    function beginJourney(e) {
      if (e) { e.preventDefault(); e.stopPropagation(); }
      enterExperience();
    }

    var beginBtnEl = document.getElementById('beginBtn');
    beginBtnEl.addEventListener('click', beginJourney);
    beginBtnEl.addEventListener('touchend', beginJourney, { passive: false });

    var overlayEl = document.getElementById('startOverlay');
    function tryStartCoverAudio() {
      if (!audioReady) {
        try {
          var AC = window.AudioContext || window.webkitAudioContext;
          if (AC && (!Tone.context || Tone.context.rawContext.state !== 'running')) {
            var ctx = new AC();
            Tone.setContext(ctx);
          }
        } catch(ex) {}
        initAudio();
        try { if (Tone.context && Tone.context.rawContext) Tone.context.rawContext.resume(); } catch(ex) {}
      }
    }
    // Any pointer/touch interaction with the overlay counts as a "user gesture" and
    // unlocks audio — so clicking anywhere (or even the CTA) starts cover music.
    overlayEl.addEventListener('touchstart', tryStartCoverAudio, { passive: true });
    overlayEl.addEventListener('pointerdown', tryStartCoverAudio);
    overlayEl.addEventListener('click', tryStartCoverAudio);
    // Also expose globally as a one-time first-click anywhere on the page —
    // useful if iOS Safari blocks the touchstart path for some reason.
    var oneShotAudioStart = function() {
      tryStartCoverAudio();
      window.removeEventListener('pointerdown', oneShotAudioStart, true);
      window.removeEventListener('touchstart', oneShotAudioStart, true);
      window.removeEventListener('keydown', oneShotAudioStart, true);
    };
    window.addEventListener('pointerdown', oneShotAudioStart, true);
    window.addEventListener('touchstart', oneShotAudioStart, true);
    window.addEventListener('keydown', oneShotAudioStart, true);

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
      geoRadius = isMobile ? Math.min(width, height) * 0.105 : Math.min(width, height) * 0.085;
      geoCircles = genForType(currentType);
      makeStars();
      positionChangeHint();
    }
  </script>
<script defer src="/_vercel/insights/script.js"></script>
<script defer src="/_vercel/speed-insights/script.js"></script>
</body>
